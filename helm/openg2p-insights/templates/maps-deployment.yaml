{{/*
The Maps surface — the Evidence static site.

No database credentials on purpose. Evidence runs its SQL at BUILD time and
bakes the answers into parquet, so what is served is a static bundle and the
browser never reaches Postgres. Refreshing the figures is an image rebuild, not
a restart, which is also why there is no probe beyond "does it serve /".
*/}}
{{- if .Values.insightMaps.enabled }}
{{- $c := .Values.insightMaps }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ $c.nameOverride }}
  labels:
    {{- include "openg2p-insights.labels" . | nindent 4 }}
    app.kubernetes.io/component: maps
spec:
  replicas: {{ $c.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-{{ $c.nameOverride }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-{{ $c.nameOverride }}
        {{- include "openg2p-insights.labels" . | nindent 8 }}
        app.kubernetes.io/component: maps
    spec:
      {{- if $c.podSecurityContext.enabled }}
      securityContext:
        fsGroup: {{ $c.podSecurityContext.fsGroup }}
      {{- end }}
      containers:
        - name: maps
          image: "{{ $c.image.repository }}:{{ $c.image.tag }}"
          imagePullPolicy: {{ $c.image.pullPolicy }}
          {{- if $c.build.enabled }}
          {{/* Serve the in-cluster build, falling back to the image's own until
               the first one lands — otherwise the maps 404 between install and
               the first successful build. `serve` reads from disk per request,
               so a rebuild needs no restart. */}}
          command: ["sh", "-c"]
          args:
            - |
              {{/* NOT `serve -s`. Single-page mode rewrites every miss to the
                   ROOT index.html, and since the site is nested under its
                   basePath (maps/) there is no root index.html any more — so a
                   request for /maps/ fell through to a DIRECTORY LISTING. The
                   site is prerendered, one real file per route, so it needs no
                   SPA fallback; plain static serving resolves maps/index.html
                   the way it is meant to. */}}
              {{/* Serve immediately, then SWAP when the build publishes.
                   The choice cannot be made once at startup: the build Job is a
                   post-install hook, so it runs AFTER this pod is ready, and a
                   pod that decided at boot serves the image's own build — the
                   default country pack, no data — until somebody notices and
                   restarts it. That is exactly what happened on first install.
                   Blocking until a build exists would deadlock instead, since
                   Helm waits for this pod before running the hook that produces
                   it. So: serve whatever is there, and re-exec when better
                   arrives. */}}
              PORT={{ $c.service.targetPort }}
              while true; do
                if [ -d /site/site ]; then
                  echo "[maps] serving the in-cluster build"
                  serve /site/site -l "$PORT" &
                  SERVE=$!
                  wait "$SERVE"
                else
                  echo "[maps] no build published yet — serving the image's own"
                  echo "[maps] (default country pack, no data) until one appears"
                  serve /app/build -l "$PORT" &
                  SERVE=$!
                  while [ ! -d /site/site ]; do
                    # Still serving; this only watches for the real build.
                    if ! kill -0 "$SERVE" 2>/dev/null; then break; fi
                    sleep 10
                  done
                  echo "[maps] build published — switching to it"
                  kill "$SERVE" 2>/dev/null || true
                  wait "$SERVE" 2>/dev/null || true
                fi
              done
          volumeMounts:
            - name: site
              mountPath: /site
              readOnly: true
          {{- end }}
          {{- if $c.containerSecurityContext.enabled }}
          securityContext:
            runAsUser: {{ $c.containerSecurityContext.runAsUser }}
            runAsNonRoot: {{ $c.containerSecurityContext.runAsNonRoot }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $c.service.targetPort }}
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with $c.resources }}
          resources: {{ toYaml . | nindent 12 }}
          {{- end }}
      {{- if $c.build.enabled }}
      volumes:
        - name: site
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-maps-site
            readOnly: true
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ $c.nameOverride }}
  labels: {{ include "openg2p-insights.labels" . | nindent 4 }}
spec:
  type: {{ $c.service.type }}
  ports:
    - name: http
      port: {{ $c.service.port }}
      targetPort: http
  selector:
    app: {{ .Release.Name }}-{{ $c.nameOverride }}
---
{{ include "openg2p-insights.virtualservice" (dict "component" $c "ctx" $) }}
{{- end }}
