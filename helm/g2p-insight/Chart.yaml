apiVersion: v2
name: g2p-insight
description: A Helm chart for OpenG2P G2P Insight (AI-driven analytics platform)
type: application
version: 0.0.0-develop
dependencies:
  - name: common
    repository: https://openg2p.github.io/openg2p-helm
    version: 2.30.0
  - name: postgres-init
    version: 1.1.0
    repository: https://openg2p.github.io/openg2p-helm
    condition: postgres-init.enabled
icon: https://openg2p.github.io/openg2p-helm/openg2p-logo.png
keywords:
  - openg2p
  - g2p-insight
  - analytics
  - ai
  - insight
maintainers:
  - email: info@openg2p.org
    name: OpenG2P
annotations:
  catalog.cattle.io/display-name: "OpenG2P G2P Insight"
  openg2p.org/add-to-rancher: ""
