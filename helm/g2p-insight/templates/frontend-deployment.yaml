{{- if .Values.insightFrontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ .Values.insightFrontend.nameOverride }}
  labels:
    {{- include "g2p-insight.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.insightFrontend.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-{{ .Values.insightFrontend.nameOverride }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-{{ .Values.insightFrontend.nameOverride }}
        {{- include "g2p-insight.labels" . | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.insightFrontend.image.repository }}:{{ .Values.insightFrontend.image.tag }}"
          imagePullPolicy: {{ .Values.insightFrontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.insightFrontend.service.targetPort }}
          env:
            {{- range $k, $v := .Values.insightFrontend.envVars }}
            - name: {{ $k }}
              value: {{ tpl (toString $v) $ | quote }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ .Values.insightFrontend.nameOverride }}
  labels:
    {{- include "g2p-insight.labels" . | nindent 4 }}
spec:
  type: {{ .Values.insightFrontend.service.type }}
  ports:
    - name: http
      port: {{ .Values.insightFrontend.service.port }}
      targetPort: {{ .Values.insightFrontend.service.targetPort }}
  selector:
    app: {{ .Release.Name }}-{{ .Values.insightFrontend.nameOverride }}
{{- end }}
