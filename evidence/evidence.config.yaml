# Served under /maps on the Insight host, not on a hostname of its own.
#
# One product, one URL: a separate maps-insights.<domain> meant a second DNS name,
# a second certificate and an iframe pointing off-origin, for what a user
# experiences as a tab inside Insights. Evidence emits ABSOLUTE asset paths, so
# serving it under a sub-path is a build-time decision — this cannot be done by
# rewriting at the gateway.
#
# NOT /maps: the Insight shell's own router already owns that path for its Maps
# TAB, so serving Evidence there means a hard load of /maps reaches Evidence
# standalone while the tab renders the shell's page — two different things behind
# one URL.
#
# nest-under-basepath.sh must agree: the build is moved under evidence/ so a
# request for /evidence/... resolves without the server knowing about the prefix.
deployment:
  basePath: /evidence

# This site is embedded by the Insight shell's Maps tab. The shell is light-only,
# so pin the appearance to light and drop the switcher — otherwise a viewer on a
# dark-mode OS gets a dark map panel inside a light app.
appearance:
  default: light
  switcher: false

theme:
  colorPalettes:
    default:
      light:
        - "#236aa4"
        - "#45a1bf"
        - "#a5cdee"
        - "#8dacbf"
        - "#85c7c6"
        - "#d2c6ac"
        - "#f4b548"
        - "#8f3d56"
        - "#71b9f4"
        - "#46a485"
      dark:
        - "#236aa4"
        - "#45a1bf"
        - "#a5cdee"
        - "#8dacbf"
        - "#85c7c6"
        - "#d2c6ac"
        - "#f4b548"
        - "#8f3d56"
        - "#71b9f4"
        - "#46a485"
  colorScales:
    default:
      light:
        - "#ADD8E6"
        - "#00008B"
      dark:
        - "#ADD8E6"
        - "#00008B"
  # OpenG2P brand chrome — see /repos/branding/guidelines.txt. These drive UI
  # accents (links, alerts, backgrounds), NOT the chart series or map choropleth
  # above, which keep Evidence's own well-tuned palettes.
  colors:
    primary:
      light: "#2A477A" # brand blue — readable for links/interactive text
      dark: "#7f9ac7"
    accent:
      light: "#F07B1A" # brand orange
      dark: "#F5BB1A"
    base:
      light: "#ffffff"
      dark: "#061327" # brand black
    info:
      light: "#2A477A"
      dark: "#7f9ac7"
    positive:
      light: "#16a34a"
      dark: "#4ade80"
    warning:
      light: "#F07B1A" # brand orange
      dark: "#F5BB1A" # brand yellow
    negative:
      light: "#dc2626"
      dark: "#f87171"

plugins:
  components:
    # This loads all of evidence's core charts and UI components
    # You probably don't want to edit this dependency unless you know what you are doing
    "@evidence-dev/core-components": {}

  datasources:
    # You can add additional datasources here by adding npm packages. 
    # Make to also add them to `package.json`.
    "@evidence-dev/bigquery": { }
    "@evidence-dev/csv": { }
    "@evidence-dev/databricks": { }
    "@evidence-dev/duckdb": { }
    "@evidence-dev/mssql": { }
    "@evidence-dev/mysql": { }
    "@evidence-dev/postgres": { }
    "@evidence-dev/source-javascript": { }
    "@evidence-dev/snowflake": { }
    "@evidence-dev/sqlite": { }
    "@evidence-dev/trino": { }
    "@evidence-dev/motherduck": { }
