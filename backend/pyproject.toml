[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "openg2p-insight"
version = "0.1.0"
description = "OpenG2P Insight — AI-driven analytics backend"
requires-python = ">=3.11"
license = { text = "MPL-2.0" }
authors = [{ name = "OpenG2P", email = "info@openg2p.org" }]
dependencies = [
    "openg2p-fastapi-common>=1.1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "anthropic>=0.40",
    "openai>=1.50",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "sqlparse>=0.5",
    "orjson>=3.10",
]

# Heavy / optional dependencies — install with `pip install -e .[ai]` when you
# want the full AI/PII pipeline. Kept out of the runtime image by default so
# the container builds in a minute or two; the runtime gracefully falls back
# to regex-only PII detection and keyword schema retrieval when these are
# missing.
[project.optional-dependencies]
ai = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    "sentence-transformers>=2.7",
    "pgvector>=0.3",
    "statsmodels>=0.14",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
