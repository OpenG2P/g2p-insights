version: "3.9"

# Local-dev convenience. Brings up Postgres + the backend.
# Superset and the master-data service are NOT brought up here — point at
# external instances via env vars.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: insight
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    depends_on: [postgres]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: insight
      DB_USER: postgres
      DB_PASSWORD: postgres
      CONFIG_PATH: /app/config/config.yaml
      CATALOG_PATH: /app/catalog
      INSIGHT__SUPERSET__URL: ${SUPERSET_URL:-https://superset.qa2.openg2p.org}
      INSIGHT__MASTERDATA__URL: ${MASTERDATA_URL:-https://masterdata.qa2.openg2p.org}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8000:8000"]
    volumes:
      - ./config:/app/config:ro
      - ./catalog:/app/catalog:ro

volumes:
  pgdata:
