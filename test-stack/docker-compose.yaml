name: g2p-insight-test

# Local-only stack for end-to-end testing of OpenG2P Insight.
# Services:
#   postgres  — registry data + insight schema (port 5433 to avoid clash)
#   superset  — local Apache Superset (no external dependency)
#   backend   — openg2p-insight FastAPI
#   frontend  — React app
#
# Master Data Service: NOT brought up locally. Insight talks to whatever URL
# is in MASTERDATA_URL (default master-data.trial.openg2p.org). Make it
# overridable via .env.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: insight-test-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: registry
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d registry"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------------------
  # Apache Superset — minimal single-container setup using their official image.
  # In real OpenG2P deployments this is replaced by superset.<env>.openg2p.org;
  # the backend's `superset.url` config simply points elsewhere.
  # ---------------------------------------------------------------------------
  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile
    image: openg2p-superset:6.1.0-pg
    container_name: insight-test-superset
    # Opt-in: `docker compose --profile with-superset up`. Off by default so the
    # stack fits comfortably on a laptop — the backend reports
    # dashboards_enabled=false and the UI hides the Dashboards tab.
    profiles: ["with-superset"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-please-change-me-in-real-deploys}
      ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      ADMIN_EMAIL: admin@example.com
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/superset
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./superset/docker-init.sh:/app/docker-init.sh:ro
      - superset_home:/app/superset_home
    entrypoint: ["/bin/bash", "/app/docker-init.sh"]

  # Local Master Data Service simulation. Keeps the stack fully self-contained
  # (no dependency on master-data.trial.openg2p.org) and serves the SAME geo
  # hierarchy that seed_data.py uses, so registry rows and /geo values align.
  mock-mds:
    build:
      context: ./mock-mds
    container_name: insight-mock-mds
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Evidence.dev — the "Maps" surface (choropleth + zoom-drill). Static build,
  # embedded by the Insight frontend's Maps tab. Opt-in (heavy build):
  #   docker compose --profile with-evidence up -d --build evidence   (make maps)
  evidence:
    profiles: ["with-evidence"]
    build:
      # ../evidence, not ./evidence: the Maps project moved out of test-stack to
      # the repo root when it became a shipped image rather than a test fixture.
      context: ../evidence
      dockerfile: Dockerfile
    container_name: insight-test-evidence
    ports:
      - "3100:3000"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        # Off by default (fast, small). `make up-ai` sets this to true for the
        # full spaCy/Presidio/embeddings/statsmodels pipeline.
        INSTALL_AI: ${INSTALL_AI:-false}
    container_name: insight-test-backend
    depends_on:
      postgres:
        condition: service_healthy
      mock-mds:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: insight
      DB_USER: postgres
      DB_PASSWORD: postgres
      CONFIG_PATH: /app/config/config.yaml
      CATALOG_PATH: /app/catalog
      INSIGHT_LLM__API_KEY: ${OPENROUTER_API_KEY:-}
      INSIGHT_LLM__MODEL: ${INSIGHT_LLM__MODEL:-anthropic/claude-sonnet-4.5}
      INSIGHT_SUPERSET__URL: ${SUPERSET_URL:-http://superset:8088}
      INSIGHT_SUPERSET__USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      INSIGHT_SUPERSET__PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      INSIGHT_MASTERDATA__URL: ${MASTERDATA_URL:-http://mock-mds:8080}
      INSIGHT_MAPS__EVIDENCE_URL: ${EVIDENCE_URL:-http://localhost:3100}
      INSIGHT_MASTERDATA__SENDER_APP_MNEMONIC: g2p-insight
      # openg2p-fastapi-common reads its OWN Settings (env_prefix=common_) when
      # applying the router prefix and DB datasource. Set those here.
      COMMON_OPENAPI_COMMON_API_PREFIX: /v1/insight
      # Backend connects to the registry DB so its read-only queries can see
      # `mv_individuals_summary` etc. The insight app's own tables
      # (audit_log, chat_session, saved_chart) live in the `insight` schema
      # in the SAME database — created by alembic.
      COMMON_DB_DATASOURCE: postgresql+asyncpg://postgres:postgres@postgres:5432/registry
    volumes:
      - ../backend/config:/app/config:ro
      - ./postgres/catalog:/app/catalog:ro

  # The frontend is normally run with `npm run dev` (Vite on :5173) for a live
  # dev loop with visible errors and no CORS. This container is kept only as an
  # opt-in production-parity check:  docker compose --profile with-frontend up
  frontend:
    profiles: ["with-frontend"]
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/v1/insight
        VITE_SUPERSET_URL: http://localhost:8088
    container_name: insight-test-frontend
    depends_on: [backend]
    ports:
      - "8080:8080"

volumes:
  pgdata:
  superset_home:
