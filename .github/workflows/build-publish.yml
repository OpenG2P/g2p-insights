name: Build & Publish

# Thin caller: all versioning/build/publish logic lives in
# openg2p/openg2p-packaging@v1. This file declares only what THIS repo contains.
# One immutable version per commit, chart and images in lockstep — the pipeline
# overrides the 0.0.0-develop placeholder in Chart.yaml at package time.
#
#   images -> docker.io/openg2p/<name>
#   chart  -> https://openg2p.github.io/openg2p-helm (catalogued on
#             https://openg2p.github.io/versions)
#
# No FASTAPI_COMMON_REF pin: the backend takes openg2p-fastapi-common from PyPI
# as a version constraint in pyproject.toml, not as a git ref.
#
# The shared workflow passes no static build args and has no `target`, so:
#   * backend/Dockerfile defaults INSTALL_AI=true — the published API image must
#     carry presidio, spaCy, sentence-transformers and statsmodels. Without them
#     PII redaction, schema embeddings and analytics degrade quietly rather than
#     failing, so a light image looks fine and answers worse.
#   * the maps builder is its own Dockerfile (evidence/Dockerfile.builder) rather
#     than a stage of evidence/Dockerfile. The `build` stage is duplicated between
#     the two; the guard job below fails if the copies drift.

on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:
    inputs:
      changelog_skip_ai:
        description: 'Skip the AI summary — publish the changelog from commit messages only (use when AI is unavailable). Leave OFF for a normal run.'
        type: boolean
        default: false
      changelog_regenerate:
        description: 'Backfill the AI summary for a release that published without one: enter its release version e.g. 1.0.1 (a bare N.N.N, not a develop version). Leave EMPTY for a normal run.'
        type: string
        default: ''

jobs:
  evidence-build-stage-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shared build stage is identical in both evidence Dockerfiles
        working-directory: evidence
        run: |
          extract() { sed -n '/^# >>> shared build stage/,/^# <<< shared build stage/p' "$1"; }
          [ -n "$(extract Dockerfile)" ] || { echo "::error::build-stage markers missing from evidence/Dockerfile"; exit 1; }
          if ! diff -u <(extract Dockerfile) <(extract Dockerfile.builder); then
            echo "::error::The build stage in evidence/Dockerfile and evidence/Dockerfile.builder differs. Edit both together."
            exit 1
          fi

  build-publish:
    needs: evidence-build-stage-in-sync
    uses: openg2p/openg2p-packaging/.github/workflows/build-publish.yml@v1
    with:
      changelog_skip_ai: ${{ inputs.changelog_skip_ai || false }}
      changelog_regenerate: ${{ inputs.changelog_regenerate || '' }}

      images: |
        [
          {
            "name": "openg2p-insights-api",
            "dockerfile": "backend/Dockerfile",
            "context": "backend"
          },
          {
            "name": "openg2p-insights-ui",
            "dockerfile": "frontend/Dockerfile",
            "context": "frontend"
          },
          {
            "name": "openg2p-insights-evidence-builder",
            "dockerfile": "evidence/Dockerfile.builder",
            "context": "evidence",
            "pins": [
              {
                "arg": "OPENG2P_DATA_BRANCH",
                "repo": "https://github.com/openg2p/openg2p-data",
                "ref": "develop"
              }
            ]
          },
          {
            "name": "openg2p-insights-evidence",
            "dockerfile": "evidence/Dockerfile",
            "context": "evidence",
            "pins": [
              {
                "arg": "OPENG2P_DATA_BRANCH",
                "repo": "https://github.com/openg2p/openg2p-data",
                "ref": "develop"
              }
            ]
          }
        ]

      chart-path: helm/openg2p-insights

      chart-image-paths: |
        [".insightBackend.image.tag",".insightFrontend.image.tag",".insightMaps.image.tag",".insightMaps.build.image.tag"]

      packaging-ref: v1

    secrets:
      docker_hub_actor: ${{ secrets.docker_hub_actor }}
      docker_hub_token: ${{ secrets.docker_hub_token }}
      OPENG2P_BOT_GITHUB_PAT: ${{ secrets.OPENG2P_BOT_GITHUB_PAT }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
